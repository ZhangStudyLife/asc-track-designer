[package]
name = "webview2-com-sys"
version = "0.38.2"
edition = "2021"
rust-version = "1.74"
license = "MIT"
description = "WebView2 COM bindings with an application-provided loader path"

[lib]
name = "webview2_com_sys"
path = "src/lib.rs"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_WindowsAndMessaging",
]

[dependencies.windows-core]
version = "0.61"
