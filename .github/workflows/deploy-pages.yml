name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4

  verify:
    runs-on: ubuntu-latest
    needs: deploy
    strategy:
      matrix:
        site:
          - https://zhangstudylife.github.io/asc-track-designer/
          - https://asc-track-designer.vercel.app/
    steps:
      - name: Verify deployed app
        shell: bash
        run: |
          html="$(curl --fail --location --retry 20 --retry-delay 5 --retry-all-errors '${{ matrix.site }}')"
          grep -q '<div id="root"></div>' <<< "$html"
          asset="$(grep -oE 'src="[^"]+\.js"' <<< "$html" | head -n 1 | cut -d '"' -f 2)"
          test -n "$asset"
          curl --fail --location --retry 20 --retry-delay 5 --retry-all-errors \
            "${{ matrix.site }}${asset#./}" > /dev/null
